name: Swift

on:
  push:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test_ios:
    runs-on: macos-arm
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: create-json
      id: create-json
      uses: jsdaniell/create-json@v1.2.1
      with:
        name: "secrets.json"
        json: '{ "oneTrustAPIKey": "${{ secrets.ONETRUST_APIKEY }}" }'
        dir: "Sources/SegmentConsentOneTrust-Tests/Resources"
    - run: xcodebuild clean -scheme SegmentConsentOneTrust test -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 17' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED="NO"

  build_and_test_tvos:
    runs-on: macos-arm
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: create-json
      id: create-json
      uses: jsdaniell/create-json@v1.2.1
      with:
        name: "secrets.json"
        json: '{ "oneTrustAPIKey": "${{ secrets.ONETRUST_APIKEY }}" }'
        dir: "Sources/SegmentConsentOneTrust-Tests/Resources"
    - run: xcodebuild clean -scheme SegmentConsentOneTrust test -sdk appletvsimulator -destination 'platform=tvOS Simulator,name=Apple TV' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED="NO"
